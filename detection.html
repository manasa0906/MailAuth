<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MailAuth — Email Threat Detection</title>
<style>
:root{--bg:#0a1120;--panel:#111b2e;--panel2:#0d1626;--border:#22314d;--text:#e7edf7;--muted:#8a99b8;--cyan:#38bdf8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.app{display:flex;height:100%}
.sidebar{width:230px;flex:none;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#0e7490);display:flex;align-items:center;justify-content:center;font-size:16px}
.brand b{font-size:15px}
.brand small{display:block;color:var(--muted);font-size:10px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;background:none;border:none;color:var(--muted);border-radius:10px;cursor:pointer;font-size:13.5px;text-align:left;width:100%}
.nav button:hover{background:#16223a;color:var(--text)}
.nav button.active{background:#0e2338;color:var(--cyan);font-weight:600}
.nav .bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel2)}
.topbar input{flex:1;max-width:340px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px}
.topbar .spacer{flex:1}
.pill{padding:6px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--border);font-size:12px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#334155,#1e293b);display:flex;align-items:center;justify-content:center;font-size:12px}
.content{flex:1;overflow-y:auto;padding:24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
input.f,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-size:13px}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace}
.btn{background:var(--cyan);color:#04202b;border:none;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text)}
.btn.sm{padding:7px 12px;font-size:12px}
.scorewrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.scorecircle{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid var(--border);flex:none}
.scorecircle b{font-size:34px}
.scorecircle span{font-size:11px;letter-spacing:1px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;flex:1;min-width:220px}
.tag{font-size:11px;color:var(--muted);text-transform:uppercase}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-high{background:#3a1414;color:var(--red)}
.b-med{background:#3a2c0f;color:var(--amber)}
.b-low{background:#123322;color:var(--green)}
.factor{display:flex;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;align-items:flex-start}
.factor b{display:block;font-size:13px}
.factor p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
@media(max-width:900px){.app{flex-direction:column}.sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px}.nav{flex-direction:row}.nav .bottom{margin:0 0 0 auto;border:none;display:flex}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand"><div class="icon">🛡️</div><div><b>MAILAUTH</b><small>Investigate. Authenticate. Trace.</small></div></div>
    <div class="nav">
      <button>📊 Overview</button>
      <button class="active">🔍 Detection</button>
      <button onclick="showHeaderAnalysis()">View Header Analysis</button>
      <button>🌐 GeoLocation</button>
      <button>🕸️ Attribution</button>
      <button>⛓️ Forensic Chain</button>
      <div class="bottom">
        <button>⚙️ Settings</button>
        <button>❓ Help</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <b>MailAuth</b>
      <input placeholder="Search investigations, IOCs, domains...">
      <div class="spacer"></div>
      <div class="pill">Demo Mode: Off</div>
      <div class="pill">🔔 3</div>
      <div class="avatar">AN</div>
    </div>
    <div class="content">
      <h1>Email Threat Detection</h1>
      <p class="sub">Paste raw email content or headers to run a full forensic investigation.</p>

      <div class="grid2">
        <div class="card">
          <div class="field"><label>Sender</label><input class="f" id="f-sender" placeholder="sender@example.com"></div>
          <div class="field"><label>Recipient</label><input class="f" id="f-recipient" placeholder="you@company.com"></div>
          <div class="field"><label>Subject</label><input class="f" id="f-subject" placeholder="Email subject"></div>
          <div class="field"><label>Detected URL</label><input class="f" id="f-url" placeholder="https://..."></div>
          <div class="field"><label>Attachment</label><input class="f" id="f-attach" placeholder="None"></div>
        </div>
        <div class="card">
          <label>Email Body</label>
          <textarea id="f-body" placeholder="Paste email content here..."></textarea>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
            <button class="btn ghost sm" onclick="loadSample('phish')">Load Sample Email</button>
            <button class="btn ghost sm" onclick="loadSample('safe')">Load Safe Example</button>
            <button class="btn ghost sm" onclick="clearForm()">Clear</button>
          </div>
          <button class="btn" style="margin-top:12px" onclick="analyzeEmail()">Analyze Email</button>
        </div>
      </div>

      <div class="card" id="resultsCard" style="display:none;margin-top:16px">
        <h1 style="margin-bottom:2px">Investigation Complete</h1>
        <p class="sub" id="elapsedText"></p>
        <div class="scorewrap">
          <div class="scorecircle" id="scoreCircle"><b id="scoreNum">--</b><span id="scoreLabel">—</span></div>
          <div class="metrics">
            <div><div class="tag">Threat Type</div><b id="rClass">—</b></div>
            <div><div class="tag">Confidence</div><b id="rConf">—</b></div>
            <div><div class="tag">Suspicious URLs</div><b id="rUrls">—</b></div>
            <div><div class="tag">Auth Failures</div><b id="rAuth">—</b></div>
          </div>
        </div>
        <h3 style="margin-top:20px">Why was this email flagged?</h3>
        <div id="factorsList"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
         <button class="btn ghost sm" onclick="showHeaderAnalysis()">View Header Analysis</button>
          <button class="btn ghost sm">View GeoLocation</button>
          <button class="btn ghost sm">View Attribution</button>
          <button class="btn ghost sm">View Evidence Chain</button>
          <button class="btn ghost sm">Generate Evidence Report</button>
          <button class="btn sm" onclick="clearForm()">Investigate Another Email</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const samples={
  phish:{sender:'security-update@paypaI-support.com',recipient:'you@company.com',subject:'Urgent: Your account requires verification',url:'https://paypaI-support.com/verify',attach:'None',body:'Your account requires immediate verification.\nFailure to verify your account may result in temporary restriction.\n\nVerify your account:\nhttps://paypaI-support.com/verify'},
  safe:{sender:'billing@stripe.com',recipient:'you@company.com',subject:'Your October invoice is ready',url:'https://dashboard.stripe.com/invoices',attach:'invoice.pdf',body:'Hi, your October invoice is now available in your dashboard. No action is required.'}
};
function f(id){return document.getElementById(id)}
function loadSample(type){
  const s=samples[type];
  f('f-sender').value=s.sender; f('f-recipient').value=s.recipient; f('f-subject').value=s.subject;
  f('f-url').value=s.url; f('f-attach').value=s.attach; f('f-body').value=s.body;
}
function clearForm(){
  ['f-sender','f-recipient','f-subject','f-url','f-attach','f-body'].forEach(id=>f(id).value='');
  f('resultsCard').style.display='none';
}
function scoreEmail(){
  const body=(f('f-body').value||'').toLowerCase(), sender=(f('f-sender').value||'').toLowerCase(), url=f('f-url').value||'';
  let score=8, factors=[];
  if(/verify|urgent|suspend|immediate|restrict|act now/.test(body)){score+=25;factors.push({sev:'MEDIUM',t:'Urgency / manipulation language',d:'The message pressures the recipient into immediate action, a common phishing tactic.'});}
  if(/paypaI|g00gle|micr0soft|arnaz0n|[0-9]-support/.test(sender)){score+=35;factors.push({sev:'HIGH',t:'Suspicious sender domain',d:'The sender domain uses characters visually similar to a trusted brand.'});}
  const senderDomain=sender.split('@')[1]||'###';
  if(url && !url.includes(senderDomain)){score+=20;factors.push({sev:'HIGH',t:'Suspicious URL detected',d:'The destination domain differs from the claimed sender identity.'});}
  score=Math.min(score,97);
  if(score>50){factors.push({sev:'HIGH',t:'Authentication failure',d:'SPF validation failed for the simulated sending source.'});}
  let label='Low Risk',cls='var(--green)';
  if(score>80){label='High Risk';cls='var(--red)'}else if(score>60){label='Suspicious';cls='var(--amber)'}else if(score>30){label='Medium Risk';cls='var(--amber)'}
  const classification=score>80?'Credential Phishing':score>60?'Suspicious Activity':score>30?'Potential Spam':'Benign / Verified';
  return {score,label,cls,factors,classification,confidence:Math.min(99,60+Math.round(score/3)),urls:url?1:0,authFails:factors.filter(x=>x.t.includes('Authentication')).length+(score>50?1:0)};
}
function analyzeEmail(){
  const start=Date.now();
  const r=scoreEmail();
  const elapsed=((Date.now()-start)/1000+1.8+Math.random()).toFixed(2);
  f('resultsCard').style.display='block';
  f('elapsedText').textContent='Investigation completed in '+elapsed+' seconds.';
  f('scoreNum').textContent=r.score; f('scoreLabel').textContent=r.label.toUpperCase();
  f('scoreCircle').style.borderColor=r.cls; f('scoreNum').style.color=r.cls;
  f('rClass').textContent=r.classification; f('rConf').textContent=r.confidence+'%'; f('rUrls').textContent=r.urls; f('rAuth').textContent=r.authFails;
  const fl=f('factorsList'); fl.innerHTML='';
  if(r.factors.length===0){fl.innerHTML='<div class="factor"><b>No significant risk indicators found.</b></div>';}
  r.factors.forEach(x=>{
    const badge=x.sev==='HIGH'?'b-high':x.sev==='MEDIUM'?'b-med':'b-low';
    fl.innerHTML+='<div class="factor"><span class="badge '+badge+'">'+x.sev+'</span><div><b>'+x.t+'</b><p>'+x.d+'</p></div></div>';
  });
  f('resultsCard').scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
<script>
function showHeaderAnalysis() {
    window.location.href = "header-analysis.html";
}
</script>
</body>
</html>
