<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MailAuth – Forensic Chain</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #070b16;
  --panel: #0b1120;
  --sidebar: #0a0f1c;
  --border: #1a2338;
  --text: #e6ebf5;
  --muted: #7d8bad;
  --teal: #22b8cf;
  --teal-bg: #0d2a33;
  --sans: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
}

.app {
  display: grid;
  grid-template-columns: 210px 1fr;
  min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding: 28px 10px 20px;
  display: flex;
  flex-direction: column;
}

/* MailAuth Logo */

.brand {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 0 8px 26px;
}

.brand-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--teal-bg);
  border: 1px solid var(--teal);
  display: grid;
  place-items: center;
  color: var(--teal);
  flex: none;
}

.brand-icon svg {
  width: 17px;
  height: 17px;
}

.brand b {
  font-size: 15px;
  display: block;
}

.brand small {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.2;
  display: block;
}

/* Navigation */

.sidebar nav {
  display: flex;
  flex-direction: column;
}
